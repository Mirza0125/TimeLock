plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

group = 'expo.modules.screenguard'
version = '0.1.0'

android {
  namespace "expo.modules.screenguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    test {
      // Loads the ONE shared vectors file Jest also reads - never copied
      // into this module. See modules/screen-guard/shared-test-vectors/.
      resources.srcDir("$projectDir/../shared-test-vectors")
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // Android's own org.json in android.jar is a stub that throws
  // "Method ... not mocked" in local (non-instrumented) unit tests.
  testImplementation 'org.json:json:20260814'
}

tasks.withType(Test).configureEach {
  testLogging {
    events 'passed', 'skipped', 'failed'
    exceptionFormat 'full'
  }
}
