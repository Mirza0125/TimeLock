plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

group = 'expo.modules.screenguard'
version = '0.1.0'

android {
  namespace "expo.modules.screenguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
